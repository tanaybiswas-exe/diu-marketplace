<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DIU Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col items-center justify-center min-h-screen antialiased px-4">
    
    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 max-w-sm w-full transition-all">
        <div class="text-center mb-6">
            <span class="text-3xl">📝</span>
            <h2 class="text-2xl font-bold text-gray-800 mt-2">Create Account</h2>
            <p class="text-xs text-gray-400 mt-1">Registering as a <span class="text-emerald-600 font-bold capitalize">{{ role }}</span></p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, m in messages %}
              <div class="bg-red-50 text-red-700 p-3 rounded-xl text-xs font-semibold mb-4 text-center border border-red-200">
                  ⚠️ {{ m }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        
        <form method="POST" class="space-y-3">
            <div>
                <label class="text-xs font-bold text-gray-600 block mb-1">Full Name</label>
                <input type="text" name="name" required placeholder="John Doe" 
                       class="w-full px-4 py-2 border rounded-xl outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 text-sm transition">
            </div>

            <div>
                <label class="text-xs font-bold text-gray-600 block mb-1">DIU Student ID</label>
                <input type="text" name="student_id" required placeholder="XXX-YY-ZZZZ" 
                       class="w-full px-4 py-2 border rounded-xl outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 text-sm transition">
            </div>

            <div>
                <label class="text-xs font-bold text-gray-600 block mb-1">DIU Email Address</label>
                <input type="email" name="email" required placeholder="yourname@diu.edu.bd" 
                       pattern="^[a-zA-Z0-9._%+-]+@diu\.edu\.bd$"
                       title="Please use your official varsity email ending with @diu.edu.bd"
                       oninput="this.value = this.value.toLowerCase()"
                       class="w-full px-4 py-2 border rounded-xl outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 text-sm transition">
            </div>

            <div>
                <label class="text-xs font-bold text-gray-600 block mb-1">Mobile Number</label>
                <input type="tel" name="mobile" required placeholder="01XXXXXXXXX" 
                       class="w-full px-4 py-2 border rounded-xl outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 text-sm transition">
            </div>
            
            <div>
                <label class="text-xs font-bold text-gray-600 block mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" 
                       class="w-full px-4 py-2 border rounded-xl outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 text-sm transition">
            </div>
            
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition shadow-md mt-2">
                Sign Up
            </button>
        </form>
        
        <div class="mt-4 border-t border-gray-100 pt-3 text-center">
            <p class="text-xs text-gray-500">Already have an account? <a href="/login" class="text-emerald-600 font-bold hover:underline">Log In</a></p>
        </div>
    </div>
</body>
</html>
