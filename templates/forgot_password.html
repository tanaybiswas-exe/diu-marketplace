<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4">
                    <h3 class="text-center text-primary mb-4">Forgot Password</h3>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}{% for cat, msg in messages %}<div class="alert alert-{{cat}}">{{msg}}</div>{% endfor %}{% endif %}
                    {% endwith %}
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Enter Official DIU Email</label>
                            <input type="email" name="email" class="form-control" placeholder="name@diu.edu.bd" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send OTP Code</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
