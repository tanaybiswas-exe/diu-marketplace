<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - DIU Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-4 rounded-4 bg-white">
                    <h3 class="fw-bold mb-4 text-dark">Edit Campus Item</h3>
                    
                    <form action="{{ url_for('edit_product', product_id=product.id) }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Product Title</label>
                            <input type="text" name="title" class="form-control" value="{{ product.title }}" required>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label fw-bold">Price (৳)</label>
                                <input type="number" name="price" class="form-control" value="{{ product.price }}" required>
                            </div>
                            <div class="col">
                                <label class="form-label fw-bold">Offer Price (৳)</label>
                                <input type="number" name="offer_price" class="form-control" value="{{ product.offer_price if product.offer_price else '' }}" placeholder="Optional">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Offer Badge Text</label>
                            <input type="text" name="offer_text" class="form-control" value="{{ product.offer_text if product.offer_text else '' }}" placeholder="e.g. 20% OFF">
                        </div>

                        <!-- 🟢 Free Delivery Option -->
                        <div class="mb-3 p-3 bg-light rounded-3 border">
                            <div class="form-check">
                                <input class="form-check-input cursor-pointer" type="checkbox" id="free_delivery" name="free_delivery" value="true" {% if product.free_delivery %}checked{% endif %}>
                                <label class="form-check-label fw-bold text-dark cursor-pointer" for="free_delivery">
                                    🚚 Free Campus Delivery Available
                                </label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Status</label>
                            <select name="status" class="form-select" disabled>
                                <option value="Pending" selected>Pending (Requires Approval)</option>
                            </select>
                            <small class="text-muted d-block mt-1">Editing resets status to pending.</small>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Category</label>
                            <select name="category" class="form-select" required>
                                <option value="">Select Category</option>
                                {% if live_categories %}
                                    {% for cat in live_categories %}
                                        <option value="{{ cat }}" {% if product.category == cat %}selected{% endif %}>{{ cat }}</option>
                                    {% endfor %}
                                {% else %}
                                    <option value="Books" {% if product.category == 'Books' %}selected{% endif %}>Books</option>
                                    <option value="Electronics" {% if product.category == 'Electronics' %}selected{% endif %}>Electronics</option>
                                    <option value="Cycles" {% if product.category == 'Cycles' %}selected{% endif %}>Cycles</option>
                                    <option value="Hostel Items" {% if product.category == 'Hostel Items' %}selected{% endif %}>Hostel Items</option>
                                    <option value="Others" {% if product.category == 'Others' %}selected{% endif %}>Others</option>
                                {% endif %}
                            </select>
                        </div>

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label fw-bold">Used Duration</label>
                                <input type="text" name="used_time" class="form-control" value="{{ product.used_time }}">
                            </div>
                            <div class="col">
                                <label class="form-label fw-bold">Location/Campus</label>
                                <input type="text" name="location" class="form-control" value="{{ product.location }}">
                            </div>
                        </div>
                        
                        <!-- 🟢 WhatsApp Number -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">WhatsApp Number</label>
                            <input type="tel" id="whatsapp_num" name="whatsapp" class="form-control" value="{{ product.whatsapp }}" required oninput="syncPaymentNumber()">
                        </div>

                        <!-- 🟢 Payment Number & Method Section -->
                        <div class="mb-3 p-3 bg-light rounded-3 border">
                            <div class="form-check mb-2">
                                <input class="form-check-input cursor-pointer" type="checkbox" id="same_as_whatsapp" onchange="togglePaymentInput()"
                                {% if not product.seller_mobile or product.seller_mobile == product.whatsapp %}checked{% endif %}>
                                <label class="form-check-label fw-bold text-dark cursor-pointer" for="same_as_whatsapp">
                                    💳 Payment number is same as WhatsApp number
                                </label>
                            </div>

                            <div class="row g-2 pt-1">
                                <div class="col-4">
                                    <label class="form-label fw-bold small mb-1">Method</label>
                                    <select name="seller_payment_method" class="form-select form-select-sm fw-bold">
                                        <option value="bKash" {% if product.seller_payment_method == 'bKash' %}selected{% endif %}>bKash</option>
                                        <option value="Nagad" {% if product.seller_payment_method == 'Nagad' %}selected{% endif %}>Nagad</option>
                                        <option value="Rocket" {% if product.seller_payment_method == 'Rocket' %}selected{% endif %}>Rocket</option>
                                    </select>
                                </div>
                                <div id="different_payment_box" class="col-8 {% if not product.seller_mobile or product.seller_mobile == product.whatsapp %}d-none{% endif %}">
                                    <label class="form-label fw-bold small mb-1">Payment Number</label>
                                    <input type="tel" id="payment_num" name="seller_mobile" class="form-control form-control-sm" value="{{ product.seller_mobile if product.seller_mobile else '' }}" placeholder="01XXXXXXXXX">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Description</label>
                            <textarea name="description" class="form-control" rows="4" required>{{ product.description }}</textarea>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">Save Changes</button>
                            <a href="{{ url_for('home') }}" class="btn btn-outline-secondary w-100 rounded-pill">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 🟢 JavaScript for Auto Sync & Toggle Payment Input -->
    <script>
        function togglePaymentInput() {
            const checkbox = document.getElementById('same_as_whatsapp');
            const paymentBox = document.getElementById('different_payment_box');
            const paymentInput = document.getElementById('payment_num');

            if (checkbox.checked) {
                paymentBox.classList.add('d-none');
                paymentInput.removeAttribute('required');
                syncPaymentNumber();
            } else {
                paymentBox.classList.remove('d-none');
                paymentInput.setAttribute('required', 'required');
            }
        }

        function syncPaymentNumber() {
            const checkbox = document.getElementById('same_as_whatsapp');
            const whatsappInput = document.getElementById('whatsapp_num');
            const paymentInput = document.getElementById('payment_num');

            if (checkbox.checked) {
                paymentInput.value = whatsappInput.value;
            }
        }

        // Initialize Form Submit Handler to ensure seller_mobile is sent correctly
        document.querySelector('form').addEventListener('submit', function() {
            syncPaymentNumber();
        });
    </script>
</body>
</html>
