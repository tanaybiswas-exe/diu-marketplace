<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password - DIU Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl border w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">🔒 Change Password</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, m in messages %}
              <div class="bg-{{ 'red' if category == 'danger' else 'emerald' }}-100 text-{{ 'red' if category == 'danger' else 'emerald' }}-700 p-3 rounded-xl mb-4 text-center text-xs font-semibold">
                  {{ m }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">Current Password</label>
                <input type="password" name="current_password" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-xl outline-none focus:border-emerald-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">New Password</label>
                <input type="password" name="new_password" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-xl outline-none focus:border-emerald-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">Confirm New Password</label>
                <input type="password" name="confirm_password" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-xl outline-none focus:border-emerald-500 text-sm">
            </div>
            
            <div class="flex gap-3 pt-2">
                <a href="/home" class="w-1/2 text-center bg-gray-100 text-gray-700 py-2.5 rounded-xl font-bold hover:bg-gray-200 transition text-sm">Cancel</a>
                <button type="submit" class="w-1/2 bg-emerald-600 text-white py-2.5 rounded-xl font-bold hover:bg-emerald-700 transition shadow text-sm">Update</button>
            </div>
        </form>
    </div>
</body>
</html>
