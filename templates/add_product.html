<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Product - DIU Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBlue: '#2563eb',
                        brandHover: '#1d4ed8',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 py-10 min-h-screen flex flex-col justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-xl border max-w-lg w-full mx-auto my-6">
        
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-gray-800">List an Item for Sale</h2>
            <a href="{{ url_for('home') }}" class="text-xs bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg font-bold hover:bg-gray-200 transition">← Back</a>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, m in messages %}
              <div class="{{ 'bg-red-100 text-red-700' if category == 'danger' else 'bg-blue-100 text-blue-700' }} p-3 rounded-xl mb-4 text-center text-xs font-semibold">
                  {{ m }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('add_product') }}" method="POST" enctype="multipart/form-data" class="space-y-4">
            
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Product Title</label>
                <input type="text" name="title" required placeholder="e.g., Hero Cycle, Calculus Book" class="w-full px-4 py-2 border rounded-xl outline-none focus:border-brandBlue text-sm">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Category</label>
                    <select name="category" required class="w-full px-3 py-2 border rounded-xl outline-none focus:border-brandBlue text-sm bg-white">
                        <option value="Electronics">Electronics</option>
                        <option value="Books">Books</option>
                        <option value="Cycles">Cycles</option>
                        <option value="Components">Lab Components</option>
                        <option value="Hostel">Hostel Items</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Regular Price (BDT)</label>
                    <input type="number" name="price" required placeholder="৳ আসল দাম" class="w-full px-4 py-2 border rounded-xl outline-none focus:border-brandBlue text-sm">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Used Duration</label>
                    <input type="text" name="used_time" placeholder="e.g., 4 Months, 1 Year" class="w-full px-4 py-2 border rounded-xl outline-none focus:border-brandBlue text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Meetup Location</label>
                    <select name="location" required class="w-full px-3 py-2 border rounded-xl outline-none focus:border-brandBlue text-sm bg-white">
                        <option value="Permanent Campus (Ashulia)">Permanent Campus</option>
                        <option value="Tong Tola">Tong Tola</option>
                        <option value="Golf Ground">Golf Ground</option>
                        <option value="DIU Smart City Gate">Smart City Gate</option>
                        <option value="3 No Gate">3 No Gate</option>
                        <option value="Daffodil Tower (Dhanmondi)">Dhanmondi Tower</option>
                    </select>
                </div>
            </div>

            <div class="p-4 bg-blue-50/50 border border-blue-100 rounded-xl space-y-3">
                <h3 class="text-xs font-black text-brandBlue uppercase tracking-wider">🎁 Special Offer / Discount (Optional)</h3>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Offer Price (BDT)</label>
                        <input type="number" name="offer_price" placeholder="৳ অফার দাম" class="w-full px-4 py-2 border rounded-xl outline-none focus:border-brandBlue text-sm bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Offer Badge Text</label>
                        <input type="text" name="offer_text" placeholder="e.g. 20% OFF / Deal" class="w-full px-4 py-2 border rounded-xl outline-none focus:border-brandBlue text-sm bg-white">
                    </div>
                </div>

                <div class="flex items-center space-x-2 pt-1">
                    <input type="checkbox" id="free_delivery" name="free_delivery" value="true" class="w-4 h-4 text-brandBlue border-gray-300 rounded focus:ring-brandBlue cursor-pointer">
                    <label for="free_delivery" class="text-xs font-bold text-gray-700 cursor-pointer select-none">
                        🚚 Free Campus Delivery Available
                    </label>
                </div>
            </div>

            <!-- WhatsApp Number -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">WhatsApp Mobile Number</label>
                <input type="tel" id="whatsapp_num" name="whatsapp" required placeholder="01XXXXXXXXX" class="w-full px-4 py-2 border rounded-xl outline-none focus:border-brandBlue text-sm">
            </div>

            <!-- Payment Details Section -->
            <div class="p-3 bg-gray-50 border rounded-xl space-y-2">
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="same_as_whatsapp" checked class="w-4 h-4 text-brandBlue border-gray-300 rounded focus:ring-brandBlue cursor-pointer" onchange="togglePaymentInput()">
                    <label for="same_as_whatsapp" class="text-xs font-bold text-gray-700 cursor-pointer select-none">
                        💳 Payment number is same as WhatsApp number
                    </label>
                </div>

                <div class="grid grid-cols-3 gap-2 pt-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Method</label>
                        <select name="seller_payment_method" class="w-full px-2 py-2 border rounded-xl outline-none focus:border-brandBlue text-xs bg-white font-bold">
                            <option value="bKash">bKash</option>
                            <option value="Nagad">Nagad</option>
                            <option value="Rocket">Rocket</option>
                        </select>
                    </div>
                    <div id="different_payment_box" class="col-span-2 hidden">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Payment Number</label>
                        <input type="tel" id="payment_num" name="seller_mobile" placeholder="01XXXXXXXXX" class="w-full px-4 py-2 border rounded-xl outline-none focus:border-brandBlue text-sm bg-white">
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Product Description</label>
                <textarea name="description" rows="3" required placeholder="Describe condition, reasons for selling, and specifications..." class="w-full px-4 py-2 border rounded-xl outline-none focus:border-brandBlue text-sm"></textarea>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">1. Main Cover Photo (Required - Max 6MB)</label>
                <input type="file" id="main_photo" name="product_photo" accept="image/*" required class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-brandBlue hover:file:bg-blue-100 cursor-pointer border rounded-xl p-1 mb-1">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-bold text-gray-700">2. Additional Images (Optional - Max 6MB each)</label>
                    <span class="text-[10px] text-gray-400 font-semibold">Max 4 photos</span>
                </div>
                <input type="file" id="extra_photos" name="additional_photos" accept="image/*" multiple class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200 cursor-pointer border rounded-xl p-1">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-brandBlue text-white py-3 rounded-xl font-bold hover:bg-brandHover transition shadow-md active:scale-[0.99] mt-4 flex items-center justify-center">
                <span id="btnText">🚀 Publish Product</span>
            </button>
        </form>
    </div>

    <script>
    // 🔴 1. Toggle Payment Number Input Field
    function togglePaymentInput() {
        const checkbox = document.getElementById('same_as_whatsapp');
        const paymentBox = document.getElementById('different_payment_box');
        const paymentInput = document.getElementById('payment_num');

        if (checkbox.checked) {
            paymentBox.classList.add('hidden');
            paymentInput.removeAttribute('required');
            paymentInput.value = '';
        } else {
            paymentBox.classList.remove('hidden');
            paymentInput.setAttribute('required', 'required');
        }
    }

    // 🔴 2. Image Validations
    document.getElementById('main_photo').addEventListener('change', function() {
        if (this.files[0] && this.files[0].size > 6 * 1024 * 1024) {
            alert('❌ Main cover photo size exceeds 6MB limit!');
            this.value = ''; 
        }
    });

    document.getElementById('extra_photos').addEventListener('change', function() {
        if (this.files.length > 4) {
            alert('❌ You can upload maximum 4 additional photos!');
            this.value = '';
            return;
        }
        for (let i = 0; i < this.files.length; i++) {
            if (this.files[i].size > 6 * 1024 * 1024) {
                alert(`❌ Image "${this.files[i].name}" exceeds 6MB limit!`);
                this.value = ''; 
                break;
            }
        }
    });

    // 🔴 3. Form Submission with Image Compression & Auto-Payment Number Logic
    document.querySelector('form').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        
        const form = this;
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
        btnText.innerHTML = `Uploading & Publishing...`;

        async function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; 
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                        }, 'image/jpeg', 0.75); 
                    };
                };
            });
        }

        const formData = new FormData();
        const inputs = form.querySelectorAll('input[type="text"], input[type="number"], input[type="tel"], select, textarea');
        inputs.forEach(input => {
            if (input.name !== 'seller_mobile') {
                formData.append(input.name, input.value);
            }
        });

        // 🟢 Auto Payment Mobile logic
        const sameAsWhatsapp = document.getElementById('same_as_whatsapp').checked;
        const whatsappVal = document.getElementById('whatsapp_num').value;
        const customPaymentVal = document.getElementById('payment_num').value;

        if (sameAsWhatsapp) {
            formData.append('seller_mobile', whatsappVal);
        } else {
            formData.append('seller_mobile', customPaymentVal);
        }

        const freeDeliveryCheck = form.querySelector('input[name="free_delivery"]');
        if (freeDeliveryCheck && freeDeliveryCheck.checked) {
            formData.append('free_delivery', 'true');
        }

        const coverInput = form.querySelector('input[name="product_photo"]');
        if (coverInput.files.length > 0) {
            const compressedCover = await compressImage(coverInput.files[0]);
            formData.append('product_photo', compressedCover);
        }

        const additionalInput = form.querySelector('input[name="additional_photos"]');
        if (additionalInput.files.length > 0) {
            for (let i = 0; i < additionalInput.files.length; i++) {
                const compressedExtra = await compressImage(additionalInput.files[i]);
                formData.append('additional_photos', compressedExtra);
            }
        }

        try {
            const response = await fetch(form.action || window.location.href, {
                method: 'POST',
                body: formData
            });
            if (response.redirected) {
                window.location.href = response.url;
            } else {
                window.location.reload();
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Upload failed! Please check your connection.");
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            btnText.innerText = "🚀 Publish Product";
        }
    });
    </script>
</body>
</html>
